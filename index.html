:root{
  --brand:#0B7A55; --brand-deep:#064E3B; --brand-soft:#DDF3E8; --accent:#F59E0B;
  --bg:#F4F8F6; --card:#FFFFFF; --fg:#14201B; --muted:#52645C; --line:#D5E2DB; --field:#E6EEEA;
  --danger:#B42318; --warn:#9A5B00; --warn-bg:#FFF1D6; --on-brand:#FFFFFF; --shadow:rgba(6,78,59,.14);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --brand:#2BB885; --brand-deep:#052E23; --brand-soft:#16352B; --accent:#F5A623;
    --bg:#0C1511; --card:#13221C; --fg:#E8F3EE; --muted:#9DB3A9; --line:#26382F; --field:#1A2C25;
    --danger:#FF8A80; --warn:#FFC766; --warn-bg:#3A2B0E; --on-brand:#04251B; --shadow:rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand:#2BB885; --brand-deep:#052E23; --brand-soft:#16352B; --accent:#F5A623;
  --bg:#0C1511; --card:#13221C; --fg:#E8F3EE; --muted:#9DB3A9; --line:#26382F; --field:#1A2C25;
  --danger:#FF8A80; --warn:#FFC766; --warn-bg:#3A2B0E; --on-brand:#04251B; --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;
  padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);overscroll-behavior:none}
button,input{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{max-width:430px;margin:0 auto;height:100%;height:100dvh;position:relative;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
@media (min-width:431px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
#screen{flex:1;min-height:0;display:flex;flex-direction:column}
#screen h1:focus{outline:none}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 24px}
.scroll.nt{padding-top:8px}
.foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.back{display:inline-flex;align-items:center;gap:2px;min-height:44px;padding:0 8px 0 0;border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px}
.lnk{border:0;background:none;padding:0;color:var(--brand);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;margin:8px 0 6px;font-weight:800;text-wrap:balance}
.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.btn{width:100%;height:52px;border:0;border-radius:14px;background:var(--brand);color:var(--on-brand);font-weight:700;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.row:focus-visible,.tab:focus-visible,.act:focus-visible,.back:focus-visible,.cty:focus-visible,.boxes:focus-within,.lnk:focus-visible,.chp:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.danger{color:var(--danger)}
label.lb,.lb{display:block;font-weight:600;font-size:14px;margin:0 0 6px}
.in{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:17px}
.in:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fld{margin-bottom:14px}
.err{color:var(--danger);font-size:13px;margin-top:6px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:8px}
.pick{height:56px;border-radius:14px;background:var(--field);display:flex;align-items:center;gap:12px;padding:0 16px;margin-bottom:12px}
.bdg{flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:800}
.phone-row{display:flex;gap:10px}
.dial{height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 14px;display:flex;align-items:center;color:var(--muted);font-size:17px}
.boxes{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;border-radius:14px}
.box{height:60px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.box.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.boxes input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:text}
.hint{font-size:13px;color:var(--muted);margin-top:14px}
.hero{background:var(--brand-deep);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 28px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--brand);opacity:.35}
.hero>*{position:relative;z-index:1}
.chip{display:inline-flex;align-items:center;gap:10px;padding:5px 14px 5px 5px;border-radius:999px;background:rgba(255,255,255,.16);font-weight:600}
.hello{font-size:14px;opacity:.9;margin-top:26px}
.name{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.15}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.act{height:56px;border-radius:16px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.act.solid{background:#fff;color:var(--brand-deep);border-color:#fff}
.card{background:var(--card);border-radius:20px;padding:18px;box-shadow:0 8px 24px var(--shadow);display:flex;gap:14px;align-items:center}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 0 12px;font-weight:800;font-size:16px}
.empty{text-align:center;padding:20px 0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tabbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:6px;border-radius:999px;background:var(--card);box-shadow:0 12px 32px var(--shadow);border:1px solid var(--line)}
.tab{min-width:92px;height:52px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}
.tab[aria-current="page"]{background:var(--brand-soft);color:var(--brand)}
.row{width:100%;min-height:72px;border:0;border-radius:18px;background:var(--card);box-shadow:0 6px 18px var(--shadow);display:flex;align-items:center;gap:14px;padding:12px 16px;margin-bottom:12px;text-align:left;cursor:pointer}
.row b{font-size:16px;display:block}.row small{color:var(--muted);font-size:13px}
.list{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 6px 18px var(--shadow)}
.cty{width:100%;height:56px;border:0;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:12px;padding:0 14px;cursor:pointer;text-align:left;font-weight:600}
.cty:last-child{border-bottom:0}
.cty[aria-checked="true"]{background:var(--brand-soft)}
.radio{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted)}
.cty[aria-checked="true"] .radio{border:6px solid var(--brand)}
.sum{background:var(--card);border-radius:18px;padding:6px 16px;margin-bottom:20px}
.sum div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-variant-numeric:tabular-nums}
.sum div span:first-child{color:var(--muted);flex:none}
.sum div b{text-align:right;overflow-wrap:anywhere}
.fee{background:var(--brand-soft);border-radius:14px;padding:14px;font-variant-numeric:tabular-nums}
.fee div{display:flex;justify-content:space-between;gap:12px;color:var(--muted)}
.fee div+div{margin-top:4px}.fee b{color:var(--fg)}
.ok{display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:center;flex:1;gap:10px;padding:24px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--brand);margin:20px 0 28px}
.tx{margin-bottom:10px}
.theme{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:12px;z-index:5;min-width:44px;justify-content:center;color:var(--muted)}
.app:has(.hero) .theme{color:#fff}
.toast{background:var(--danger);color:#fff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;margin-bottom:12px}
[data-theme="dark"] .toast{color:#1a0705}
.sw{display:flex;align-items:center;gap:12px;min-height:44px;font-weight:600;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--brand)}
.chps{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px}
.chps.wrap{flex-wrap:wrap;overflow:visible}
.chp{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.chp[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.st{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700}
.st.success{background:var(--brand-soft);color:var(--brand)}
.st.pending{background:var(--warn-bg);color:var(--warn)}
.st.failed{background:#FDE4E1;color:var(--danger)}
[data-theme="dark"] .st.failed{background:#3B1512}
.offline{background:var(--danger);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top,0px))}
.spin{width:64px;height:64px;border-radius:50%;border:6px solid var(--brand-soft);border-top-color:var(--brand);animation:rot .9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.prose h2{font-size:16px;margin:20px 0 6px}.prose p,.prose li{color:var(--muted);font-size:14px;margin:0 0 8px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
@media (prefers-reduced-motion:no-preference){.scroll,.ok{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}

<body>
<div class="app"><div id="live" class="sr" aria-live="polite"></div><main id="screen"></main></div>
<script>
/* Configuration d'AK Pay. En production, ce fichier est le seul à modifier par environnement. */
window.AKPAY_CONFIG = {
  MODE: 'test',                          // 'test' = tout est simulé dans l'app ; 'live' = appelle API_BASE
  API_BASE: 'https://api.akpay.example', // URL de VOTRE serveur (jamais celle d'un opérateur)
  TEST_OTP: '12345'
};

</script>
<script>
(function(){
'use strict';
/* ───────────────────────── Configuration ───────────────────────── */
const C=Object.assign({MODE:'test',API_BASE:'',TEST_OTP:'12345',POLL_MS:1200,POLL_MAX:6,LOCK_AFTER_MS:60000,IDLE_MS:300000},window.AKPAY_CONFIG||{});
const NAME='AK Pay';
const HOME={code:'CI',name:"Côte d'Ivoire",dial:'+225',cur:'XOF'};
const COUNTRIES=[['BJ','Bénin','+229','XOF'],['SN','Sénégal','+221','XOF'],['TG','Togo','+228','XOF'],['ML','Mali','+223','XOF'],['NE','Niger','+227','XOF'],['BF','Burkina Faso','+226','XOF'],['GA','Gabon','+241','XAF'],['CM','Cameroun','+237','XAF']].map(c=>({code:c[0],name:c[1],dial:c[2],cur:c[3]}));
/* prefixes = indication seulement (portabilité des numéros possible) : ne bloque jamais l'envoi */
const NETWORKS=[['Wave','#CFE3FF',[]],['Orange','#FFD9B8',['07','08','09']],['MTN','#FFEB99',['04','05','06']],['Moov','#CDE8FF',['01','02','03']],['Celpaid','#D3F2DE',[]]].map(n=>({name:n[0],tint:n[1],pre:n[2]}));
const FEE=0.015, MIN_I=500, MIN_L=250, LIM_U=200000, LIM_V=1000000;
const CONTACTS=[['Awa Diallo','07 12 34 56 78'],['Moussa Traoré','05 98 76 54 32'],['Fatou Koné','01 23 45 67 89'],['Ibrahim Ouattara','07 65 43 21 09']];
const GIFTS=[5000,10000,25000,50000], QUICK=[1000,5000,10000,25000,50000];
const STATUS={success:'Réussi',pending:'En cours',failed:'Échec'};
const TESTNOTE=C.MODE==='test'?" Mode test : aucun argent réel n'a été déplacé.":'';

/* ───────────────────────── Utilitaires ───────────────────────── */
const NB=' ';
const group=s=>String(s).replace(/\B(?=(\d{3})+(?!\d))/g,NB);
const fcfa=n=>group(Math.round(n))+NB+'FCFA';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const enc=new TextEncoder();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);return a};
const uid=()=>(crypto.randomUUID?crypto.randomUUID():hex(rand(16)));
const digits=s=>String(s||'').replace(/\D/g,'');
const fmtPhone=t=>digits(t).slice(0,10).replace(/(\d{2})(?=\d)/g,'$1 ').trim();
const fmtBirth=t=>{const d=digits(t).slice(0,8);return[d.slice(0,2),d.slice(2,4),d.slice(4)].filter(Boolean).join('/')};
const fmtDate=(v,time)=>{if(/^\d{2}\/\d{2}\/\d{4}$/.test(v))return v;const d=new Date(v);if(isNaN(d))return String(v||'');return d.toLocaleDateString('fr-FR')+(time?' à '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'')};
const fee=a=>Math.round(a*FEE);
const weakPin=p=>/^(\d)\1+$/.test(p)||'0123456789'.includes(p)||'9876543210'.includes(p);
function validBirth(v){
  const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);if(!m)return 'Format JJ/MM/AAAA';
  const d=+m[1],mo=+m[2],y=+m[3],t=new Date(y,mo-1,d);
  if(t.getFullYear()!==y||t.getMonth()!==mo-1||t.getDate()!==d)return 'Date invalide';
  const now=new Date();let age=now.getFullYear()-y;if(now<new Date(now.getFullYear(),mo-1,d))age--;
  if(age<18)return 'Vous devez avoir 18 ans ou plus';if(age>120)return 'Date invalide';return '';
}
function netHint(phone,net){ // message d'avertissement non bloquant
  const p=digits(phone);if(!net||!net.pre.length||p.length<2)return '';
  return net.pre.includes(p.slice(0,2))?'':'Ce numéro ne semble pas être un numéro '+net.name+'. Vérifiez-le avant de continuer.';
}
/* Calcul des montants. Local : le payeur peut prendre les frais à sa charge. International : toujours à sa charge. */
function calc(d){const a=d.amount,f=fee(a);
  if(d.kind==='local'&&!d.payFees)return{recv:a-f,fee:f,total:a};
  return{recv:a,fee:f,total:a+f};}

/* SHA-256 en JS pur : repli si crypto.subtle est indisponible (contexte non sécurisé) */
let K2,H2;
function sha256hex(str){
  if(!K2){const pr=[];for(let n=2;pr.length<64;n++)if(pr.every(p=>n%p))pr.push(n);
    const fr=x=>Math.floor((x-Math.floor(x))*4294967296);K2=pr.map(p=>fr(Math.cbrt(p)));H2=pr.slice(0,8).map(p=>fr(Math.sqrt(p)))}
  const m=enc.encode(str),l=m.length,buf=new Uint8Array(((l+9+63)>>6)*64);buf.set(m);buf[l]=0x80;
  const dv=new DataView(buf.buffer);dv.setUint32(buf.length-4,(l*8)>>>0);dv.setUint32(buf.length-8,Math.floor(l*8/4294967296));
  const h=H2.slice(),w=new Uint32Array(64),rr=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let o=0;o<buf.length;o+=64){
    for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
    for(let i=16;i<64;i++){const s0=rr(w[i-15],7)^rr(w[i-15],18)^(w[i-15]>>>3),s1=rr(w[i-2],17)^rr(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)>>>0}
    let[a,b,c,d,e,f,g,hh]=h;
    for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(hh+S1+ch+K2[i]+w[i])>>>0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)>>>0;hh=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
    [a,b,c,d,e,f,g,hh].forEach((v,i)=>{h[i]=(h[i]+v)>>>0});
  }
  return h.map(x=>x.toString(16).padStart(8,'0')).join('');
}
const subtle=window.crypto&&crypto.subtle;
async function kdf(pin,salt,ver){
  if(ver==='pbkdf2'&&subtle){
    const k=await subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
    return hex(await subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:150000},k,256));
  }
  let h=salt+pin;for(let i=0;i<3000;i++)h=sha256hex(h+salt);return h;
}

/* ───────────────────────── Passerelle API ─────────────────────────
   Mode test : tout est simulé. Mode live : l'app ne parle QU'À votre serveur (voir docs/etude-integration).
   Les clés Wave / Orange / MTN / Moov ne doivent jamais se trouver dans l'application. */
async function req(method,path,body,headers){
  const r=await fetch(C.API_BASE+path,{method,headers:Object.assign({'Content-Type':'application/json'},headers||{}),body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.message||'Erreur serveur ('+r.status+')');
  return j;
}
const API={
  async requestOtp(phone){return C.MODE==='test'?{ok:true}:req('POST','/v1/auth/otp',{msisdn:HOME.dial+digits(phone)})},
  async verifyOtp(phone,code){return C.MODE==='test'?{ok:code===C.TEST_OTP}:req('POST','/v1/auth/otp/verify',{msisdn:HOME.dial+digits(phone),code})},
  async createTransfer(p,t){
    if(C.MODE==='test')return{ref:'AK'+Date.now().toString().slice(-8)+hex(rand(1)).toUpperCase(),status:'pending'};
    return req('POST','/v1/transfers',p,{'Idempotency-Key':p.idempotency_key}); // TODO live : vérification du PIN côté serveur
  },
  async getTransfer(t){
    if(C.MODE==='test'){const age=Date.now()-new Date(t.date).getTime();return{status:age<1800?'pending':(t.simFail?'failed':'success')}}
    return req('GET','/v1/transfers/'+encodeURIComponent(t.ref));
  },
  // Carte cadeau : lire le solde d'un code. Mode live : GET /v1/gifts/{code} -> { status: 'valid'|'used'|'expired', balance }
  async checkGift(code){
    if(C.MODE==='test'){const n=x=>String(x).toUpperCase().replace(/[^A-Z0-9]/g,''),g=S.gifts.find(x=>n(x.code)===n(code));
      return g?{status:g.used?'used':'valid',balance:g.used?0:g.amt}:{status:'unknown'}}
    return req('GET','/v1/gifts/'+encodeURIComponent(code));
  },
  async submitKyc(k){return C.MODE==='test'?{status:'ok'}:req('POST','/v1/kyc',k)},
  // Mode live : le PIN est AUSSI vérifié par le serveur (création du compte, changement, chaque transfert). Jamais stocké en clair côté app.
  async register(phone,pin,P){return C.MODE==='test'?{ok:true}:req('POST','/v1/accounts',{msisdn:HOME.dial+digits(phone),pin,profile:{first_name:P.fn,last_name:P.ln,email:P.em,birth_date:P.bd}})},
  async changePin(phone,oldPin,newPin){return C.MODE==='test'?{ok:true}:req('POST','/v1/accounts/pin',{msisdn:HOME.dial+digits(phone),old_pin:oldPin,new_pin:newPin})}
};

/* ───────────────────────── État et stockage ───────────────────────── */
const S={stack:['phone'],flow:'',phone:'',otp:'',profile:{ln:'',fn:'',em:'',bd:''},pin:'',pin1:'',cp:'',ph:'',salt:'',kdf:'',fail:0,lockUntil:0,
  tx:[],gifts:[],benef:[],kycs:'none',kyc:{doc:'',num:'',f1:false,f2:false},tab:'home',tmr:null,authed:false,
  draft:null,sel:0,gamt:0,gname:'',done:null,hf:'all',pc:{step:0,old:'',n1:''},popN:0};
const KEY='akpay_v2',OLD='akpay_v1';
const limit=()=>S.kycs==='ok'?LIM_V:LIM_U;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({phone:S.phone,profile:S.profile,ph:S.ph,salt:S.salt,kdf:S.kdf,fail:S.fail,lockUntil:S.lockUntil,tx:S.tx,gifts:S.gifts,benef:S.benef,kycs:S.kycs}))}catch(e){}};
const wipe=()=>{try{localStorage.removeItem(KEY);localStorage.removeItem(OLD)}catch(e){}};
async function setPin(p){S.salt=hex(rand(16));S.kdf=subtle?'pbkdf2':'js';S.ph=await kdf(p,S.salt,S.kdf);S.fail=0;S.lockUntil=0}
async function checkPin(p){
  const now=Date.now();
  if(now<S.lockUntil)return{ok:false,locked:true,secs:Math.ceil((S.lockUntil-now)/1000)};
  if(await kdf(p,S.salt,S.kdf)===S.ph){S.fail=0;save();return{ok:true}}
  S.fail++;let secs=0;
  if(S.fail%5===0){secs=Math.min(30*2**(S.fail/5),900);S.lockUntil=Date.now()+secs*1000}
  save();return{ok:false,locked:secs>0,secs,left:5-(S.fail%5)};
}
const pinMsg=r=>r.locked?'Trop d\'essais. Réessayez dans '+(r.secs>=60?Math.ceil(r.secs/60)+' min':r.secs+' s')+'.':'Code PIN incorrect. '+r.left+(r.left>1?' essais restants':' essai restant')+' avant blocage.';
const migTx=t=>t.status?t:Object.assign({},t,{status:'success',kind:t.kind||'local',total:t.total!=null?t.total:t.amount,phone:t.phone||''});
async function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d&&d.ph){Object.assign(S,{phone:d.phone||'',profile:d.profile||S.profile,ph:d.ph,salt:d.salt,kdf:d.kdf,fail:d.fail|0,lockUntil:d.lockUntil|0,tx:(d.tx||[]).map(migTx),gifts:d.gifts||[],benef:d.benef||[],kycs:d.kycs||'none'});return true}
    const o=JSON.parse(localStorage.getItem(OLD)||'null'); // migration : l'ancienne version stockait le PIN en clair
    if(o&&o.pin1){S.phone=o.phone||'';S.profile=o.profile||S.profile;S.tx=(o.tx||[]).map(migTx);S.gifts=o.gifts||[];S.kycs=o.verified?'ok':'none';await setPin(o.pin1);save();localStorage.removeItem(OLD);return true}
  }catch(e){}
  return false;
}
const resetAll=()=>{Object.assign(S,{phone:'',otp:'',profile:{ln:'',fn:'',em:'',bd:''},pin:'',pin1:'',cp:'',ph:'',salt:'',kdf:'',fail:0,lockUntil:0,tx:[],gifts:[],benef:[],kycs:'none',draft:null,tab:'home',authed:false,flow:''});wipe()};

/* ───────────────────────── Navigation ───────────────────────── */
const root=document.getElementById('screen'),live=document.getElementById('live');
const $=(s,r)=>(r||root).querySelector(s),$$=(s,r)=>[...(r||root).querySelectorAll(s)];
const cur=()=>S.stack[S.stack.length-1];
let suppress=0,afterReset=null;
const go=n=>{S.stack.push(n);history.pushState({d:S.stack.length-1},'');show()};
const back=()=>{if(S.stack.length>1)history.back()};
const backN=n=>{S.popN=n;history.go(-n)};
/* reset : repart d'une pile vide. `then` s'exécute une fois l'historique du navigateur réellement revenu au début. */
const reset=(n,then)=>{const depth=S.stack.length-1;S.stack=[n];
  if(depth>0){suppress=1;afterReset=then||null;history.go(-depth);show()}else{history.replaceState({d:0},'');show();then&&then()}};
window.addEventListener('popstate',()=>{
  if(suppress){suppress=0;history.replaceState({d:0},'');const f=afterReset;afterReset=null;f&&f();return}
  if(S.popN){const k=S.popN;S.popN=0;for(let i=0;i<k&&S.stack.length>1;i++)S.stack.pop();show();return} // retour de plusieurs écrans voulu (ex. « Réessayer »)
  if(cur()==='processing'){history.pushState({d:S.stack.length-1},'');return}  // impossible de quitter pendant un paiement
  if(cur()==='done'){reset('home');return}                                     // écran terminal : retour = accueil
  S.stack.pop();show();
});

/* ───────────────────────── Composants ───────────────────────── */
const svg=(p,s,w)=>`<svg width="${s||20}" height="${s||20}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const ic={
  back:svg('<path d="M15 6l-6 6 6 6"/>'),next:svg('<path d="M9 6l6 6-6 6"/>'),
  swap:svg('<path d="M7 7h12l-3-3M17 17H5l3 3"/>'),
  globe:svg('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>'),
  gift:svg('<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 12h18M12 8c-2-4-6-3-5 0 .5 1 3 1 5 0zM12 8c2-4 6-3 5 0-.5 1-3 1-5 0z"/>'),
  shield:svg('<path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3z"/><path d="M9 12l2 2 4-4"/>',34,1.8),
  pulse:svg('<path d="M3 12h4l2-6 4 12 2-6h6"/>',28),
  check:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>',44,2.6),x:svg('<path d="M6 6l12 12M18 6L6 18"/>',44,2.6),clock:svg('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',44,2.4),
  logo:'<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B7A55"/><path d="M12 14h14l-3.5-3.5M28 26H14l3.5 3.5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="29" cy="12" r="3" fill="#F59E0B"/></svg>'
};
const backBtn=()=>`<button class="back" data-back>${ic.back}Retour</button>`;
const foot=label=>`<div class="foot"><button class="btn" data-next disabled>${label}</button></div>`;
const boxes=(id,o)=>{o=o||{};return `<div class="boxes" data-boxes="${id}">${[0,1,2,3,4].map(i=>`<div class="box" aria-hidden="true" data-i="${i}"></div>`).join('')}<input id="${id}" type="${o.secret?'password':'text'}" inputmode="numeric" pattern="[0-9]*" autocomplete="${o.otp?'one-time-code':'off'}" maxlength="5" aria-label="${o.label||'Code à 5 chiffres'}" data-secret="${o.secret?1:0}"></div>`};
function paintBoxes(id,val){
  const w=$(`[data-boxes="${id}"]`);if(!w)return;const inp=$('input',w),secret=inp.dataset.secret==='1';
  $$('.box',w).forEach((b,i)=>{b.textContent=val[i]?(secret?'•':val[i]):'';b.classList.toggle('on',i===val.length&&document.activeElement===inp)});
}
function bindBoxes(id,get,set,after){
  const inp=$('#'+id);if(!inp)return;inp.value=get();paintBoxes(id,get());
  inp.addEventListener('input',()=>{const v=digits(inp.value).slice(0,5);inp.value=v;set(v);paintBoxes(id,v);after&&after()});
  inp.addEventListener('focus',()=>paintBoxes(id,get()));inp.addEventListener('blur',()=>paintBoxes(id,get()));
  setTimeout(()=>inp.focus({preventScroll:true}),30);
}
const setNext=ok=>{const b=$('[data-next]');if(b)b.disabled=!ok};
const setErr=t=>{const e=$('.err');if(e)e.textContent=t||''};
const netRow=(n,i,sub)=>`<button class="row" data-net="${i}"><span class="bdg" style="width:44px;height:44px;background:${n.tint};color:#17132B">${n.name[0]}</span><span style="flex:1"><b>${n.name}</b><small>${sub}</small></span>${ic.next}</button>`;
const initials=()=>((S.profile.fn[0]||'')+(S.profile.ln[0]||'')).toUpperCase()||'AK';
const emptyBlock=`<div class="empty"><span class="bdg" style="width:64px;height:64px">${ic.pulse}</span><b style="font-size:16px;margin-top:8px">Pas d'activité récente</b><span style="color:var(--muted);max-width:260px">Effectuez un premier transfert pour voir vos activités ici.</span></div>`;
const txCard=(t,i)=>`<button class="card tx" data-tx="${i}" style="width:100%;border:0;text-align:left;cursor:pointer;color:inherit"><span class="bdg" style="width:40px;height:40px;font-size:13px">${esc(t.cc)}</span><div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">${esc(t.to)}</b><div style="font-size:12px;color:var(--muted)">${esc(fmtDate(t.date))} · ${esc(t.net)}</div></div><div style="text-align:right"><b style="font-variant-numeric:tabular-nums;white-space:nowrap;${t.status==='failed'?'text-decoration:line-through;opacity:.6':''}">-${fcfa(t.total!=null?t.total:t.amount)}</b>${t.status&&t.status!=='success'?`<div><span class="st ${t.status}">${STATUS[t.status]}</span></div>`:''}</div></button>`;
const bindTx=()=>$$('[data-tx]').forEach(b=>b.onclick=()=>{S.sel=+b.dataset.tx;go('receipt')});
const bindGo=()=>$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
const twoTap=(btn,label,fn)=>{let armed=false;const o=btn.textContent;btn.onclick=()=>{if(!armed){armed=true;btn.textContent=label;setTimeout(()=>{armed=false;btn.textContent=o},4000)}else fn()}};
const genCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=()=>[...rand(4)].map(b=>A[b&31]).join('');return 'AKP-'+r()+'-'+r()};
async function shareText(text,btn){
  try{if(navigator.share){await navigator.share({text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);btn.textContent='Copié'}catch(e){btn.textContent='Copie impossible'}
}
function startFlow(kind,pre){S.draft={kind,pre:pre||null,payFees:false,amount:0,key:null,sent:false};go(kind==='local'?'lnet1':'network')}
function addBenef(d){
  const b=d.kind==='local'?{kind:'local',name:d.rname,phone:d.rphone,net:d.dstNet.name}:{kind:'intl',name:d.rname,phone:d.rphone,cc:d.dest.code,net:d.srcNet.name};
  S.benef=S.benef.filter(x=>!(x.kind===b.kind&&x.phone===b.phone&&(x.net===b.net)&&x.cc===b.cc));S.benef.unshift(b);S.benef=S.benef.slice(0,8);
}
async function refreshPending(){
  const p=S.tx.filter(t=>t.status==='pending');if(!p.length)return;let ch=false;
  for(const t of p){try{const r=await API.getTransfer(t);if(r.status&&r.status!=='pending'&&r.status!==t.status){t.status=r.status;ch=true}}catch(e){}}
  if(ch){save();if(cur()==='home'||cur()==='history')show()}
}

/* ───────────────────────── Exécution d'un transfert ───────────────────────── */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(){
  const d=S.draft;if(!d||d.sent){if(!d)reset('home');return}
  d.sent=true;const c=calc(d),loc=d.kind==='local';
  const phone=loc?HOME.dial+' '+d.rphone:d.dest.dial+' '+d.rphone;
  const t={id:uid(),ref:'',kind:d.kind,cc:loc?'CI':d.dest.code,to:d.rname||phone,phone,net:loc?d.srcNet.name+' → '+d.dstNet.name:d.srcNet.name+' → '+d.dest.name,
    amount:d.amount,fee:c.fee,total:c.total,recv:c.recv,cur:loc?'XOF':d.dest.cur,date:new Date().toISOString(),status:'pending',key:d.key};
  if(C.MODE==='test'&&digits(d.rphone).slice(-2)==='99')t.simFail=true; // numéro finissant par 99 = échec simulé
  const payload={account_msisdn:HOME.dial+digits(S.phone),pin:d.pin,idempotency_key:d.key,type:d.kind,amount:d.amount,currency:'XOF',fees_paid_by:loc&&!d.payFees?'recipient':'sender',fee:c.fee,total:c.total,
    source:{network:d.srcNet.name,msisdn:HOME.dial+digits(loc?d.debit.replace(HOME.dial,''):S.phone)},
    destination:loc?{country:'CI',network:d.dstNet.name,msisdn:HOME.dial+digits(d.rphone),name:d.rname}:{country:d.dest.code,msisdn:d.dest.dial+digits(d.rphone),name:d.rname,currency:d.dest.cur}};
  d.pin=null;let r;
  try{r=await API.createTransfer(payload,t)}catch(e){
    d.sent=false;S.done={title:'Transfert non envoyé',text:(e&&e.message?e.message+' ':'')+'Aucun transfert n\'a été créé. Vérifiez votre connexion et réessayez.',tab:'home',state:'fail'};
    if(S.authed&&cur()==='processing')go('done');return}
  t.ref=r.ref;t.status=r.status||'pending';S.tx.unshift(t);addBenef(d);save();
  for(let i=0;i<C.POLL_MAX&&t.status==='pending';i++){
    await sleep(C.POLL_MS);
    try{const s=await API.getTransfer(t);if(s.status)t.status=s.status}catch(e){}
  }
  save();if(!S.authed||cur()!=='processing')return;
  const who=t.to;
  if(t.status==='success')S.done={title:'Transfert envoyé',text:fcfa(c.recv)+' envoyés à '+who+'.'+TESTNOTE,tab:'home',state:'ok',receipt:true};
  else if(t.status==='failed'){d.key=null;S.done={title:'Transfert échoué',text:'Le transfert n\'a pas abouti.'+(C.MODE==='test'?' Échec simulé (numéro finissant par 99).':' Consultez le reçu pour le détail.'),tab:'home',state:'fail',receipt:true}}
  else S.done={title:'Transfert en cours',text:'Votre transfert est en cours de traitement. Le statut sera mis à jour dans vos activités.',tab:'home',state:'pending',receipt:true};
  go('done');
}

/* ───────────────────────── Affichage ───────────────────────── */
let busy=false;
function show(){
  clearInterval(S.tmr);
  const sc=screens[cur()];
  root.innerHTML=sc.render();
  const h=$('h1');if(h){h.setAttribute('tabindex','-1');live.textContent=h.textContent}
  const b=$('[data-back]');if(b)b.onclick=back;
  const n=$('[data-next]');
  if(n)n.onclick=async()=>{if(busy)return;busy=true;n.disabled=true;try{await sc.next()}catch(e){setErr(e&&e.message||'Une erreur est survenue.')}finally{busy=false;const nb=$('[data-next]');if(nb&&nb===n&&!n.dataset.keep)n.disabled=false}};
  sc.bind&&sc.bind.call(sc);
  setTimeout(()=>{if(h&&(document.activeElement===document.body||!root.contains(document.activeElement)))h.focus({preventScroll:true})},80);
  const sc2=$('.scroll');if(sc2)sc2.scrollTop=0;
}

/* ───────────────────────── Démarrage ───────────────────────── */
// Thème (clair / sombre / système), mémorisé
const THEME='akpay_theme',metaTheme=document.querySelector('meta[name="theme-color"]');
const applyTheme=t=>{const r=document.documentElement;if(t)r.setAttribute('data-theme',t);else r.removeAttribute('data-theme')};
try{applyTheme(localStorage.getItem(THEME))}catch(e){}
const themeBtn=document.createElement('button');
themeBtn.className='theme back';themeBtn.setAttribute('aria-label','Changer le thème');
themeBtn.innerHTML=svg('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/>');
themeBtn.onclick=()=>{const r=document.documentElement,d=r.getAttribute('data-theme'),sys=matchMedia('(prefers-color-scheme: dark)').matches;
  const next=d==='dark'?'light':d==='light'?'dark':(sys?'light':'dark');applyTheme(next);try{localStorage.setItem(THEME,next)}catch(e){}};
document.querySelector('.app').appendChild(themeBtn);

// Verrouillage automatique : app en arrière-plan > 1 min, ou 5 min sans toucher l'écran
let hiddenAt=0,last=Date.now();
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(S.authed&&hiddenAt&&Date.now()-hiddenAt>C.LOCK_AFTER_MS&&cur()!=='processing')lock();
  hiddenAt=0;
});
['pointerdown','keydown'].forEach(e=>addEventListener(e,()=>{last=Date.now()},{passive:true}));
setInterval(()=>{if(S.authed&&cur()!=='processing'&&Date.now()-last>C.IDLE_MS)lock()},15000);
addEventListener('online',()=>{if(cur()==='home')show()});addEventListener('offline',()=>{if(cur()==='home')show()});

(async function init(){
  if(await load())S.stack=['login'];
  history.replaceState({d:0},'');
  show();
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
if(C.MODE==='test')window.__akpay={S,screens,calc,checkPin,sha256hex,kdf,validBirth,netHint,weakPin};
})();

</script>
